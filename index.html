<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){var r=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;window.RM=r;if(!r)document.documentElement.classList.add("anim")})()</script>
<title>Léah Transforma</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FCF9F4;--paper2:#F4EDE1;--ink:#1F1519;--mut:#6B5C62;--rule:#1F1519;--ln:#DCD3C6;--rose:#E82878;--rosed:#C41A62;--rose2:#FDE8F1;--blue:#2F7FA6;--blue2:#E6F4FA;--gold:#B8923A;--gold2:#E6CF8F;--goldd:#7A5C12;--red:#B3261E;--onr:#fff;--sf:rgba(255,255,255,.6);--bg2:#F4EDE1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--paper:#191215;--paper2:#241A1E;--ink:#F4ECEE;--mut:#BBA9B0;--rule:#F4ECEE;--ln:#3A2D32;--rosed:#F58AB6;--rose2:#3A2230;--blue:#7CC4E8;--blue2:#1F3340;--goldd:#E6CF8F;--sf:rgba(255,255,255,.04);--bg2:#241A1E;--red:#FF8A80;--onr:#191215}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 Lora,Georgia,"Times New Roman",serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
main{max-width:1560px;margin:0 auto;padding:10px 16px 80px}
@media(min-width:900px){main{padding:12px 40px 80px}}
.sans,.dateline,.nav button,.tg,.kick,.cbtn,.btn,.leg,.camp small,.dt,.cal,.cd,.row small,.know b,.quote small{font-family:Nunito,system-ui,sans-serif}
.dateline{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--rule);padding:6px 0;color:var(--mut)}
.titlebar{display:grid;grid-template-columns:1fr;gap:12px;align-items:center;text-align:center;padding:14px 0 10px}
@media(min-width:900px){.titlebar{grid-template-columns:210px 1fr 230px}}
.plogo{height:120px;width:auto;max-width:100%;display:block;margin:0 auto}
.ttl h1{margin:0;font:900 clamp(46px,9vw,108px)/.95 'Playfair Display',Georgia,serif;letter-spacing:-.01em}
.ttl h1 em{font-style:italic;font-weight:700;color:var(--rose)}
.tag{margin:8px 0 0;font:italic 400 clamp(14px,2vw,20px) Lora,Georgia,serif;color:var(--mut)}
.rule2{height:9px;border-top:4px solid var(--rule);border-bottom:1px solid var(--gold)}
.camp{border:1px solid var(--rule);padding:0 10px 10px;text-align:center}
.camp i{display:block;height:10px;margin:0 -10px 8px;border-bottom:1px solid rgba(0,0,0,.15)}
.camp small{font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.camp h2{margin:2px 0;font:900 22px/1.1 'Playfair Display',Georgia,serif}
.camp p{margin:0;font-size:14px;line-height:1.35}
.camp .nx{margin-top:6px;font-size:12px;color:var(--mut);border-top:1px solid var(--ln);padding-top:5px}
.esp{display:flex;gap:14px;align-items:center;border:3px double var(--gold);background:linear-gradient(100deg,#FFF6DC,#FFFBEF);padding:12px 18px;margin:12px 0;color:#4A3A10}
.esp b{font:900 22px 'Playfair Display',Georgia,serif;color:#7A5C12;display:block}
.esp .st{font-size:30px;line-height:1;color:var(--gold)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;justify-content:flex-start;gap:0;overflow-x:auto;border-bottom:1px solid var(--rule);margin-bottom:4px}
.nav button{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:0;background:none;color:var(--ink);padding:10px 12px;white-space:nowrap;cursor:pointer}
.nav button{flex:none}
.nav button:first-of-type{margin-left:auto}.nav button:last-of-type{margin-right:auto}
.nav button+button::before{content:"·";margin-right:24px;margin-left:-12px;color:var(--gold)}
.nav button:hover{color:var(--rosed)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:6px 0}
.chips button{font:600 13px Nunito,system-ui,sans-serif;border:1px solid var(--rule);background:none;color:var(--ink);padding:5px 12px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--paper)}
section{scroll-margin-top:64px;margin-top:28px}
section>h2{margin:0;font:900 22px/1.2 'Playfair Display',Georgia,serif;text-transform:uppercase;letter-spacing:.05em;border-top:4px solid var(--rule);border-bottom:1px solid var(--rule);padding:7px 0}
.sub{color:var(--mut);margin:6px 0 12px;font:italic 400 15px Lora,Georgia,serif}
.front{display:grid;gap:24px;margin-top:20px}
@media(min-width:1000px){.front{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.fside{border-left:1px solid var(--rule);padding-left:24px}}
.kick{margin:0;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rosed)}
.mh{font:900 clamp(32px,4.8vw,58px)/1.04 'Playfair Display',Georgia,serif;margin:8px 0 12px}
.lead{font-size:19px;white-space:pre-wrap;margin:10px 0 0}
.lead::first-letter{float:left;font:900 64px/.8 'Playfair Display',Georgia,serif;padding:6px 8px 0 0;color:var(--rose)}
.vpb{background:var(--red);color:#fff;padding:2px 8px;letter-spacing:.08em}
.row3{display:grid;gap:24px}
@media(min-width:1000px){.row3{grid-template-columns:repeat(3,minmax(0,1fr))}.row3>section+section{border-left:1px solid var(--rule);padding-left:24px}}
.row3>section{margin-top:28px}
.row2{display:grid;gap:24px}
@media(min-width:1000px){.row2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}}
.segcols .grid{display:block}
@media(min-width:760px){.segcols .grid{columns:2;column-gap:28px}}
@media(min-width:1200px){.segcols .grid{columns:3}}
.segcols .grid>*{break-inside:avoid;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr;gap:0}
.card{border:1px solid var(--rule);border-top:4px solid var(--rule);padding:12px 14px;background:var(--sf);margin-bottom:14px}
.card h3{margin:0 0 8px;font:900 15px Nunito,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--rosed)}
.card h3::after{content:"";display:block;width:30px;height:2px;background:var(--gold);margin-top:5px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.row small{display:block;color:var(--mut)}.row b{color:var(--rosed);font-family:Nunito,system-ui,sans-serif}
.pr{justify-content:flex-start;gap:12px}.pr .who{flex:1;min-width:0}.pr b{margin-left:auto;text-align:right}
.row.hat1{padding-top:44px}
.av{display:flex;gap:14px;border-top:1px solid var(--ln);padding:14px 0;align-items:flex-start;background:none}
.av:first-child{border-top:0}
.av.fx{border-top:2px solid var(--gold)}
.av.imp{border-top:3px solid var(--red)}
.av.resp{border:1px solid var(--gold);border-top:4px solid var(--gold);background:linear-gradient(120deg,#FFF6DC,transparent);padding:14px;color:var(--ink);margin-bottom:12px}
.av.resp h3{font-size:24px}
.av.mv{flex-direction:column}
.av.breve{opacity:.7}
.dt{flex:none;width:54px;text-align:center;border:1px solid var(--rule);background:var(--paper2);padding:6px 0}
.dt b{display:block;font:900 24px/1 'Playfair Display',Georgia,serif;color:var(--rosed)}
.dt span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}
.bd{flex:1;min-width:0;width:100%}
.bd h3{margin:4px 0 4px;font:700 20px/1.2 'Playfair Display',Georgia,serif;overflow-wrap:anywhere;color:var(--ink)}
.bd p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;opacity:.88}
.meta{font:800 13px Nunito,system-ui,sans-serif;color:var(--blue)}
.ps{font:700 20px 'Playfair Display',Georgia,serif;color:var(--rosed)}
.tg{display:flex;gap:0;flex-wrap:wrap;align-items:center}
.tg span{font-weight:800;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--rosed);background:none;padding:0}
.tg span+span::before{content:"·";margin:0 7px;color:var(--mut)}
.tg .vp{background:var(--red);color:#fff;padding:2px 7px}
.tg .vp+span::before{margin-left:9px}
.tg .gd{color:var(--goldd)}
.tg .cl{color:var(--mut)}
.cdn{font:800 12px Nunito,system-ui,sans-serif;color:var(--rosed);margin-top:6px;letter-spacing:.06em;text-transform:uppercase}
.lk{display:inline-block;margin-top:8px;font:800 13px Nunito,system-ui,sans-serif;color:var(--blue);letter-spacing:.05em;text-transform:uppercase}
.foto{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border:1px solid var(--rule)}
.vid{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000}
video.vid{max-height:80vh;object-fit:contain}
.nvh{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.ph{display:grid;place-items:center;aspect-ratio:16/10;background:repeating-linear-gradient(45deg,var(--paper2),var(--paper2) 8px,transparent 8px,transparent 16px);border:1px dashed var(--gold);color:var(--goldd);font:italic 700 17px 'Playfair Display',Georgia,serif;text-align:center;padding:10px}
.quote{border-top:3px double var(--rule);border-bottom:3px double var(--rule);padding:16px 6px;font:italic 700 24px/1.3 'Playfair Display',Georgia,serif;text-align:center;margin:0 0 16px}
.quote small{display:block;margin-top:8px;font-weight:800;font-size:11px;font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:var(--goldd)}
.know{border-left:4px solid var(--gold);background:var(--paper2);padding:10px 14px;margin-bottom:12px;font-size:15px}
.know b{color:var(--goldd);text-transform:uppercase;letter-spacing:.12em;font-size:12px}
.empty{color:var(--mut);padding:8px 0;font-style:italic}
details summary{cursor:pointer;font:800 13px Nunito,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;margin:14px 0 8px}
.avt{position:relative;flex:none;width:54px;height:54px;border-radius:50%;background:var(--rose2);display:grid;place-items:center;font:800 16px Nunito,system-ui,sans-serif;color:var(--rosed)}
.avt img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;filter:grayscale(.15)}
.avt.bday{box-shadow:0 0 0 3px var(--gold)}
.hat{position:absolute;width:46px;height:50px;top:-38px;left:50%;margin-left:-12px;transform:rotate(14deg);z-index:2}
.btn{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:0;background:var(--ink);color:var(--paper);padding:9px 14px;cursor:pointer;margin-top:10px}
#cf{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.calwrap{display:grid;gap:16px}
@media(min-width:760px){.calwrap{grid-template-columns:minmax(290px,370px) 1fr}}
.chd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chd b{font:900 20px 'Playfair Display',Georgia,serif}
.cbtn{font:700 18px Nunito,system-ui,sans-serif;border:1px solid var(--rule);background:none;color:var(--ink);padding:2px 12px;cursor:pointer}
.cbanner{display:flex;gap:8px;align-items:center;padding:8px 14px;margin-bottom:10px;font-family:Nunito,system-ui,sans-serif}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal u{text-decoration:none;text-align:center;font-size:11px;color:var(--mut);font-weight:800}
.cd{aspect-ratio:1;border:1px solid var(--ln);background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 14px Nunito,system-ui,sans-serif;cursor:pointer;color:var(--ink);padding:0}
.cd.hj{border:2px solid var(--gold)}
.cd.sel{background:var(--rose);color:#fff;border-color:var(--rose)}
.cd.vz{visibility:hidden}
.dots{display:flex;gap:2px;height:6px;margin-top:2px}.dots i{width:6px;height:6px;border-radius:50%;display:block}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--mut);margin-top:10px}
.leg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}
.evl .row{align-items:flex-start}
.evl i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.mch.ret{display:grid;gap:22px}
@media(min-width:760px){.mch.ret{grid-template-columns:minmax(0,1fr) minmax(240px,360px)}}
.foto.port{aspect-ratio:9/16;max-height:640px;width:100%;object-fit:cover}
.units{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.unit h4{margin:0 0 4px;font:900 14px Nunito,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.12em;border-bottom:1px solid var(--rule);padding-bottom:6px;color:var(--rosed)}
.unit h4 span{color:var(--mut);font-weight:700}
.units .avt{width:40px;height:40px;font-size:13px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ================= ANIMAÇÕES E INTERAÇÕES ================= */
html{scroll-behavior:auto}
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--rose),var(--gold),var(--blue));pointer-events:none}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:54vmax;height:54vmax;border-radius:50%;will-change:transform;translate:0 calc(var(--sy,0)*var(--k,-.1)*1px);animation:drift 28s ease-in-out infinite alternate}
.bg i:nth-child(1){left:-18vmax;top:-14vmax;background:radial-gradient(circle,rgba(232,40,120,.13),transparent 65%);--k:-.12}
.bg i:nth-child(2){right:-20vmax;top:30vh;background:radial-gradient(circle,rgba(184,146,58,.17),transparent 65%);--k:-.2;animation-duration:34s;animation-delay:-8s}
.bg i:nth-child(3){left:10vw;top:110vh;background:radial-gradient(circle,rgba(47,127,166,.13),transparent 65%);--k:-.3;animation-duration:40s;animation-delay:-16s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(7vw,5vh,0) scale(1.18)}}

/* hero */
.hin{--d:0s}
.anim .hin{opacity:0;translate:0 14px;animation:hin .9s cubic-bezier(.2,.8,.2,1) var(--d) forwards}
@keyframes hin{to{opacity:1;translate:0 0}}
.anim .ttl h1 .ch{display:inline-block;opacity:0;translate:0 .55em;rotate:7deg;animation:chIn 1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*48ms + 180ms)}
@keyframes chIn{to{opacity:1;translate:0 0;rotate:0deg}}
.wd{display:inline-block;white-space:nowrap}
.ttl{translate:0 calc(var(--sy,0)*.07px)}
.ttl h1{translate:calc(var(--px,0)*-7px) calc(var(--py,0)*-4px);transition:translate .35s ease-out}
.plogo{translate:calc(var(--px,0)*12px) calc(var(--py,0)*8px);rotate:calc(var(--sy,0)*.04deg);transition:translate .35s ease-out,scale .4s cubic-bezier(.3,1.6,.5,1);cursor:pointer;animation:bob 6s ease-in-out infinite}
.plogo:hover{scale:1.07}
@keyframes bob{50%{margin-top:-5px}}
.anim .rule2{transform-origin:center;scale:0 1;animation:draw 1.3s .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes draw{to{scale:1 1}}
[data-cf]{cursor:pointer}

/* ticker */
.tick{overflow:hidden;border-bottom:1px solid var(--rule);background:var(--paper2);font:800 12px Nunito,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.tick[hidden]{display:none}
.tk{display:inline-flex;padding:9px 0;animation:mq var(--dur,40s) linear infinite}
.tick:hover .tk{animation-play-state:paused}
.tkc{display:flex}
.tkc span{padding:0 20px;cursor:pointer;transition:color .2s}
.tkc span:hover{color:var(--rosed)}
.tkc span::after{content:"★";color:var(--gold);margin-left:40px;display:inline-block}
.tkc span:hover::after{animation:spin 1.2s linear infinite}
@keyframes mq{to{translate:calc(var(--w)*-1) 0}}
@keyframes spin{to{rotate:360deg}}

/* nav */
.nav button{transition:color .25s}
.nav button.on{color:var(--rosed)}
.nav .ind{position:absolute;left:0;bottom:0;height:3px;width:var(--w,0px);translate:var(--x,0px) 0;background:var(--rose);opacity:0;transition:translate .45s cubic-bezier(.3,1.2,.5,1),width .45s cubic-bezier(.3,1.2,.5,1),opacity .3s;pointer-events:none}
.nav .ind.on{opacity:1}
.nav{scrollbar-width:none}.nav::-webkit-scrollbar{display:none}

/* revelar ao rolar */
.anim .rv{opacity:0;translate:0 30px;transition:opacity .85s cubic-bezier(.2,.7,.2,1) var(--d,0ms),translate .85s cubic-bezier(.2,.7,.2,1) var(--d,0ms),scale .85s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}
.anim .rv.l{translate:-34px 0}
.anim .rv.z{translate:0 0;scale:.93}
.anim .rv.in{opacity:1;translate:0 0;scale:1}
.anim section>h2.rv{opacity:1;translate:0 0;clip-path:inset(0 100% 0 0);transition:clip-path 1.1s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}
.anim section>h2.rv.in{clip-path:inset(0 0 0 0)}
.anim .zm.rv{opacity:1;translate:0 0;clip-path:inset(0 0 100% 0);transition:clip-path 1.2s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}
.anim .zm.rv.in{clip-path:inset(0 0 0 0)}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.12em;margin-bottom:-.12em}
.w>span{display:inline-block}
.anim .rvw .w>span{translate:0 108%;transition:translate 1s cubic-bezier(.2,.8,.2,1) calc(var(--i)*75ms + var(--d,0ms))}
.anim .rvw.in .w>span{translate:0 0}

/* fotos: parallax + zoom */
.zm{overflow:hidden;border:1px solid var(--rule);background:var(--paper2)}
.zm .foto{border:0;transform:scale(1.16);will-change:transform}

/* cartões: inclinação 3D + brilho que segue o mouse */
.tl{position:relative;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,box-shadow .35s}
.tl:hover{box-shadow:0 18px 34px -18px rgba(0,0,0,.4)}
.tl::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(232,40,120,.11),transparent 70%);opacity:0;transition:opacity .35s}
.tl:hover::after{opacity:1}

/* microinterações */
.av .bd h3{background:linear-gradient(var(--rose),var(--rose)) 0 100%/0 2px no-repeat;transition:background-size .5s cubic-bezier(.2,.7,.2,1);width:fit-content;max-width:100%}
.av:hover .bd h3{background-size:100% 2px}
.card .row{transition:padding .25s}
.card .row:not(.hat1):hover{padding-left:8px}
.btn{transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
.btn:hover{transform:translateY(-2px) scale(1.04);background:var(--rosed);color:#fff}
.btn:active{transform:scale(.96)}
.chips button{transition:background .2s,color .2s,transform .2s}
.chips button:hover{transform:translateY(-2px)}
.tg .vp,.vpb{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(179,38,30,.55)}50%{box-shadow:0 0 0 7px rgba(179,38,30,0)}}
.avt{transition:scale .3s cubic-bezier(.3,1.6,.5,1)}
.avt:hover{scale:1.1}
.avt.bday{animation:ring 2.4s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 3px var(--gold),0 0 0 3px rgba(201,162,75,0)}50%{box-shadow:0 0 0 3px var(--gold),0 0 0 11px rgba(201,162,75,.18)}}
.hat{animation:sway 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(8deg)}50%{transform:rotate(21deg) translateY(-2px)}}
.row.hat1{background:linear-gradient(100deg,transparent 30%,rgba(232,40,120,.08) 50%,transparent 70%) 0 0/250% 100%;animation:shine 3.5s linear infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-50% 0}}
.esp .st{animation:spin 7s linear infinite;display:inline-block}
.esp{position:relative;overflow:hidden}
.esp::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);animation:glint 4.5s ease-in-out infinite}
@keyframes glint{0%{left:-80px}55%,100%{left:110%}}
.cd{transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}

 var t=e.target.closest?e.target.closest('.tl'):null;if(t!==tcur)tiltReset();if(!t)return;tcur=t;var r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 t.style.setProperty('--rx',((.5-y)*4).toFixed(2)+'deg');t.style.setProperty('--ry',((x-.5)*5).toFixed(2)+'deg');t.style.setProperty('--mx',(x*100).toFixed(1)+'%');t.style.setProperty('--my',(y*100).toFixed(1)+'%')},{passive:true});

}).then(function(rk){RK=rk;render()}).catch(function(){$('app').innerHTML='<p class="empty">Não foi possível carregar os dados agora. Tente novamente em instantes.</p>'});
